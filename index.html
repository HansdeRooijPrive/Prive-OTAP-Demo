<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privé Demo</title>
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Demo">
<link rel="manifest" href='data:application/manifest+json,{"name":"Priv%C3%A9%20Demo","short_name":"Demo","display":"standalone","start_url":"."}'>
<style>:root { --merk: #2563eb; --merk-donker: #1e40af; --merk-licht: #3b82f6; }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #222; background: #f5f6f7; }
main { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
h1 { color: var(--merk); margin: .2em 0 .4em; font-size: 26px; letter-spacing: -.02em; }
.muted { color: #667; }
.klein { font-size: 12.5px; }
code { background: #eef0f2; padding: 1px 5px; border-radius: 5px; font-size: .92em; }
#env-badge:not(:empty) { display: inline-block; vertical-align: middle; background: var(--merk); color: #fff;
  padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.kaart { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px; margin-top: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06); }
button { background: var(--merk); color: #fff; border: 0; border-radius: 9px; padding: 10px 18px;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: background .12s; }
button:hover { background: var(--merk-donker); }
</style>
</head>
<body>
<main>
  <h1>Privé Demo <span id="env-badge"></span></h1>
  <p class="muted">Demo-app op het OTAP-platform. Deze pagina bewijst de keten:
    build uit <code>src/</code>, thema en opslag per omgeving, en deploy naar GitHub Pages.</p>
  <div class="kaart">
    <button id="tik">Tik mij</button>
    <p>Aantal tikken (bewaard per omgeving): <b id="teller">0</b></p>
    <p class="muted klein">Opslagsleutel: <code id="sleutel"></code></p>
  </div>
</main>
<script>(function () {
'use strict';

// Door build.py per omgeving ingevuld:
const STORAGE_KEY = 'prive-demo';   // prod / .acc / .test
const ENV = 'prod';
const ENV_LABEL = '';
function lees() {
  try { return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0; }
  catch (e) { return 0; }
}
function schrijf(n) {
  try { localStorage.setItem(STORAGE_KEY, String(n)); } catch (e) { /* geen opslag */ }
}
function teken() {
  document.getElementById('teller').textContent = lees();
}
if (ENV_LABEL) document.getElementById('env-badge').textContent = ENV_LABEL;
document.getElementById('sleutel').textContent = STORAGE_KEY;
teken();
document.getElementById('tik').addEventListener('click', function () {
  schrijf(lees() + 1);
  teken();
});

// Testhaakje voor de geautomatiseerde tests.
window.__app = { get env() { return ENV; }, get key() { return STORAGE_KEY; }, lees: lees, schrijf: schrijf };
})();
</script>
</body>
</html>
