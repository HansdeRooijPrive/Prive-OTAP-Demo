<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{APP_NAME}}</title>
<meta name="theme-color" content="{{MERK}}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{APP_SHORT}}">
<link rel="manifest" href='data:application/manifest+json,{"name":"{{APP_NAME_URL}}","short_name":"{{APP_SHORT}}","display":"standalone","start_url":"."}'>
<style>{{STYLES}}</style>
</head>
<body>
<main>
  <h1>{{APP_NAME}} <span id="env-badge"></span></h1>
  <p class="muted">Demo-app op het OTAP-platform. Deze pagina bewijst de keten:
    build uit <code>src/</code>, thema en opslag per omgeving, en deploy naar GitHub Pages.</p>
  <div class="kaart">
    <button id="tik">Tik mij</button>
    <p>Aantal tikken (bewaard per omgeving): <b id="teller">0</b></p>
    <p class="muted klein">Opslagsleutel: <code id="sleutel"></code></p>
  </div>
</main>
<script>{{SCRIPT}}</script>
</body>
</html>
